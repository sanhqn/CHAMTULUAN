<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Xác Thực Quyền Giáo Viên - Thầy Sah</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f0c1b; font-family: 'Segoe UI', Roboto, sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
        .login-box { background: #1a152f; padding: 30px; border-radius: 12px; border: 1px solid rgba(56, 189, 248, 0.3); width: 100%; max-width: 380px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h2 { color: #38bdf8; font-size: 18px; margin-bottom: 15px; font-weight: bold; }
        input { width: 100%; padding: 10px; margin-bottom: 15px; background: #0f0c1b; border: 1px solid rgba(56, 189, 248, 0.4); border-radius: 6px; color: #fff; text-align: center; font-size: 16px; outline: none; }
        button { width: 100%; padding: 10px; background: linear-gradient(135deg, #6a3fc8, #4a2a96); color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: linear-gradient(135deg, #4a2a96, #3f2285); }
        .error { color: #f87171; font-size: 13px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <!-- MÀN HÌNH NHẬP MẬT KHẨU -->
    <div id="loginScreen" class="login-box">
        <h2>🔒 KHU VỰC DÀNH CHO GIÁO VIÊN</h2>
        <input type="password" id="passInput" placeholder="Nhập mật khẩu quản trị..." onkeypress="checkEnter(event)">
        <button onclick="xacThuc()">Truy Cập</button>
        <div id="errorMsg" class="error">Mật khẩu không chính xác!</div>
    </div>

    <!-- NỘI DUNG FORM SOẠN ĐỀ (BỊ ẨN BAN ĐẦU) -->
    <div id="contentScreen" style="display:none; width:100%; height:100%;">
        <!-- Toàn bộ code giao diện soạn đề màu tím của thầy sẽ nằm ở đây -->
        <iframe src="ĐƯỜNG_LINK_HOẶC_NỘI_DUNG_SOẠN_ĐỀ_CỦA_THẦY" style="width:100%; height:100%; border:none;"></iframe>
    </div>

    <script>
        function xacThuc() {
            var matKhauDung = "123456"; // 👉 THẦY ĐỔI MẬT KHẨU TẠI ĐÂY
            var nhapVao = document.getElementById("passInput").value;
            
            if (nhapVao === matKhauDung) {
                document.getElementById("loginScreen").style.display = "none";
                document.getElementById("contentScreen").style.display = "block";
            } else {
                document.getElementById("errorMsg").style.display = "block";
                document.getElementById("passInput").value = "";
            }
        }
        function checkEnter(e) {
            if (e.key === 'Enter') xacThuc();
        }
    </script>
</body>
</html>
