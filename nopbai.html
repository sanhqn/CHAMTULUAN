<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Chấm Bài Tự Luận - Thầy Sah</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            /* Đổi màu nền tổng thể của trang (Ví dụ: Màu tối sang trọng) */
            background-color: #0f0c1b;
        }
        
        /* Tạo khung viền màu sắc và hiệu ứng ánh sáng neon bao quanh ứng dụng */
        .iframe-wrapper {
            width: 100%;
            height: 100%;
            padding: 10px; /* Khoảng cách lề xung quanh khung */
            background: linear-gradient(135deg, #1a152f, #0f0c1b);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 1px solid rgba(56, 189, 248, 0.3); /* Viền màu xanh cyan nhẹ nhàng */
            border-radius: 12px; /* Bo tròn các góc khung cho hiện đại */
            display: block;
            background-color: #ffffff; /* Màu nền bên trong ứng dụng */
        }
    </style>
</head>
<body>

    <div class="iframe-wrapper">
        <!-- THẦY CHỈ CẦN THAY ĐƯỜNG LINK EXEC VÀO ĐÂY -->
        <iframe src="https://script.google.com/macros/s/AKfycbyJvaju6h8S-zqghzsQvUPyO9a_R50sLMMuGxSabVJYe-1ADTZrEevYXrLj5I5XQxiM/exec"></iframe>
    </div>

</body>
</html>
