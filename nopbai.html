<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý ngân hàng câu hỏi tự luận</title>
    <!-- Tailwind CSS cho nút bấm đẹp mắt -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f0c1b;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .main-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 10px;
            background: linear-gradient(135deg, #1a152f, #0f0c1b);
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            background: rgba(26, 21, 47, 0.95);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 10px 10px 0 0;
            color: #38bdf8;
        }
        iframe {
            width: 100%;
            height: calc(100% - 50px);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-top: none;
            border-radius: 0 0 10px 10px;
            display: block;
            background-color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- THANH ĐIỀU HƯỚNG PHÍA TRÊN -->
        <div class="top-bar">
            <div class="flex items-center space-x-2 font-bold text-sm uppercase tracking-wide">
                <span>⚡ Hệ Thống Đang Hoạt Động</span>
            </div>
            <a href="index.html" class="px-3 py-1.5 bg-[#0f0c1b] border border-cyan-500/40 rounded-lg text-xs font-semibold text-cyan-300 hover:bg-cyan-950 transition flex items-center space-x-1 shadow">
                <span>← Về Trang Chủ</span>
            </a>
        </div>

        <!-- KHUNG ỨNG DỤNG GOOGLE APPS SCRIPT -->
        <!-- Thầy thay link exec tương ứng của phần đó vào src bên dưới -->
        <iframe src="https://script.google.com/macros/s/AKfycbyJvaju6h8S-zqghzsQvUPyO9a_R50sLMMuGxSabVJYe-1ADTZrEevYXrLj5I5XQxiM/exec"></iframe>
    </div>

</body>
</html>
