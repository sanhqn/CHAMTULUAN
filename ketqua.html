<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theo Dõi Chấm Bài Tự Luận - Thầy Sah</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        background-color: #0f0c1b;
        color: #38bdf8;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .custom-card {
        background: rgba(26, 21, 47, 0.95);
        border: 1px solid rgba(56, 189, 248, 0.3);
      }
      table th, table td {
        white-space: nowrap;
      }
    </style>
</head>
<body class="min-h-screen py-6 px-4">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- HEADER -->
        <div class="flex justify-between items-center bg-[#1a152f] p-4 rounded-xl border border-cyan-500/30">
            <div class="flex items-center space-x-3">
                <span class="text-2xl">📊</span>
                <h1 class="text-xl font-bold text-cyan-400 uppercase tracking-wider">Theo Dõi Chấm Bài Tự Luận</h1>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="taiDuLieu()" class="px-4 py-2 bg-cyan-600 hover:bg-cyan-500 text-white font-semibold rounded-lg shadow transition flex items-center space-x-2">
                    <span>🔄 Làm Mới</span>
                </button>
                <a href="index.html" class="px-4 py-2 bg-[#0f0c1b] border border-cyan-500/30 rounded-lg text-cyan-300 hover:bg-cyan-950 transition">
                    ← Về Trang Chủ
                </a>
            </div>
        </div>

        <!-- KHUNG HIỂN THỊ BẢNG DỮ LIỆU -->
        <div class="custom-card rounded-xl shadow-xl overflow-hidden p-4">
            <div id="trang-thai" class="text-cyan-300 mb-4 text-sm">Đang tải dữ liệu từ hệ thống...</div>
            
            <div class="overflow-x-auto max-h-[650px] rounded-lg border border-cyan-500/20">
                <table id="bang-ket-qua" class="w-full text-left border-collapse text-sm text-cyan-100 hidden">
                    <thead id="bang-header" class="bg-[#151026] text-cyan-400 uppercase text-xs sticky top-0 border-b border-cyan-500/30">
                        <!-- Header sẽ được tạo tự động -->
                    </thead>
                    <tbody id="bang-body" class="divide-y divide-cyan-500/10">
                        <!-- Dữ liệu sẽ được điền tự động -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        // 🔗 ĐƯỜNG LINK WEB APP CỦA THẦY
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzm4GAtYsGI1OEFuSHNOxDoIDHZ5-IqV0JtmW2WvTn5wzxamk34lBD4X3V9tnSCtxPJ/exec?action=getData";

        function taiDuLieu() {
            const trangThai = document.getElementById("trang-thai");
            const bang = document.getElementById("bang-ket-qua");
            const theHeader = document.getElementById("bang-header");
            const theBody = document.getElementById("bang-body");

            trangThai.innerHTML = "Đang kết nối lấy dữ liệu từ Google Sheets, vui lòng đợi...";
            trangThai.className = "text-yellow-400 mb-4 text-sm";

            fetch(WEB_APP_URL)
                .then(response => response.json())
                .then(data => {
                    // Lấy dữ liệu từ sheet Results làm mặc định hiển thị
                    const ketQuaSheet = data.Results;
                    if (!ketQuaSheet || !ketQuaSheet.headers || !ketQuaSheet.rows) {
                        throw new Error("Cấu trúc dữ liệu trả về không đúng.");
                    }

                    const headers = ketQuaSheet.headers;
                    const rows = ketQuaSheet.rows;

                    // Xây dựng Header bảng
                    let headerHtml = "<tr>";
                    headers.forEach(h => {
                        headerHtml += `<th class="p-3 font-semibold">${h}</th>`;
                    });
                    headerHtml += "</tr>";
                    theHeader.innerHTML = headerHtml;

                    // Xây dựng Danh sách Dòng (Rows)
                    let bodyHtml = "";
                    rows.forEach(row => {
                        bodyHtml += "<tr class='hover:bg-cyan-950/40 transition'>";
                        row.forEach((cell, index) => {
                            // Định dạng màu sắc đặc biệt cho cột Trạng Thái hoặc Điểm nếu cần
                            let cellClass = "p-3";
                            if (headers[index] === "TrangThai") {
                                if (cell === "ĐÃ CHẤM") {
                                    cell += " <span class='px-2 py-0.5 bg-green-950 text-green-400 border border-green-500/40 rounded text-xs ml-1'>ĐÃ CHẤM</span>";
                                } else if (cell === "LỖI") {
                                    cell += " <span class='px-2 py-0.5 bg-red-950 text-red-400 border border-red-500/40 rounded text-xs ml-1'>LỖI</span>";
                                }
                            }
                            bodyHtml += `<td class="${cellClass}">${cell !== null && cell !== undefined ? cell : ""}</td>`;
                        });
                        bodyHtml += "</tr>";
                    });
                    theBody.innerHTML = bodyHtml;

                    // Hiển thị bảng lên
                    bang.classList.remove("hidden");
                    trangThai.innerHTML = `✅ Đã tải thành công tổng cộng <b>${rows.length}</b> bản ghi dữ liệu từ hệ thống!`;
                    trangThai.className = "text-green-400 mb-4 text-sm font-semibold";
                })
                .catch(error => {
                    console.error("Lỗi:", error);
                    trangThai.innerHTML = "❌ Không thể tải dữ liệu. Thầy kiểm tra lại đường link Web App.";
                    trangThai.className = "text-red-400 mb-4 text-sm";
                });
        }

        // Tự động tải dữ liệu ngay khi mở trang
        window.onload = taiDuLieu;
    </script>
</body>
</html>
